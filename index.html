<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modus Mobile Tool</title>

  <!-- Parámetros PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f6feb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Estilo base oscuro de alto rendimiento -->
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>

  <!-- Interfaz de la app -->
  <h2>Panel Operativo ATDM</h2>
  <div id="app">Listo para operar.</div>

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[ATDM] Service Worker activo'))
          .catch(err => console.error('[ATDM] Error SW:', err));
      });
    }
  </script>
</body>
</html>
